name: 3MFPreview
options:
  bundleIdPrefix: com.designspiders
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  3MFPreview:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: 3MFPreviewQL
      - target: 3MFThumbnail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designspiders.3MFPreview
        PRODUCT_NAME: 3MF Preview
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 3MF Preview
        LSApplicationCategoryType: public.app-category.utilities
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.designspiders.3mf
            UTTypeDescription: 3MF 3D Model
            UTTypeConformsTo: [public.data, public.3d-content]
            UTTypeTagSpecification:
              public.filename-extension: [3mf]
              public.mime-type: [model/3mf]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true

  3MFPreviewQL:
    type: app-extension
    platform: macOS
    sources: [Preview, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designspiders.3MFPreview.Preview
        PRODUCT_NAME: 3MFPreviewQL
    info:
      path: Preview/Info.plist
      properties:
        CFBundleDisplayName: 3MF Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.designspiders.3mf]
            QLSupportsSearchableItems: false
    entitlements:
      path: Preview/Preview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true

  3MFThumbnail:
    type: app-extension
    platform: macOS
    sources: [Thumbnail, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designspiders.3MFPreview.Thumbnail
        PRODUCT_NAME: 3MFThumbnail
    info:
      path: Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: 3MF Thumbnail
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.designspiders.3mf]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: Thumbnail/Thumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true

  # Unit tests compile the shared 3MF code directly, so they need no host app.
  3MFPreviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - Shared
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designspiders.3MFPreview.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  3MFPreview:
    build:
      targets:
        3MFPreview: all
    test:
      targets: [3MFPreviewTests]
